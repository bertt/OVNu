<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVNu – Vertrektijden bus & trein</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9CXPZBW9C6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-9CXPZBW9C6');
</script>
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div>
        <h1>🚏 OVNu</h1>
        <p class="subtitle">Vertrektijden bus, trein & tram bij de dichtstbijzijnde halte of station</p>
      </div>
      <a href="lines" style="color:#fff;opacity:.9;font-size:.85rem;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.5);padding:.3rem .75rem;border-radius:20px">📋 Alle lijnen</a>
    </div>
  </header>

  <main>
    <!-- Search box -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Zoek halte, station of plaatsnaam…" autocomplete="off" />
      <button id="gpsBtn" title="Gebruik mijn locatie">📍 Gebruik locatie</button>
    </div>

    <!-- Status message -->
    <div id="statusMsg" class="status-msg" hidden></div>

    <!-- Content area: map + stops list -->
    <div class="content-grid" id="contentGrid" hidden>
      <div id="map"></div>

      <aside class="stops-panel">
        <h2>Dichtstbijzijnde haltes & stations</h2>
        <ul id="stopsList" class="stops-list"></ul>
      </aside>
    </div>

    <!-- Departures panel -->
    <section id="departuresPanel" class="departures-panel" hidden>
      <div class="departures-header">
        <h2 id="departuresTitle">Vertrektijden</h2>
        <div class="day-selector">
          <button class="day-btn" data-day="weekday">Ma–Vr</button>
          <button class="day-btn active" data-day="today">Vandaag</button>
          <button class="day-btn" data-day="saturday">Zaterdag</button>
          <button class="day-btn" data-day="sunday">Zondag</button>
        </div>
      </div>

      <div id="departuresContent" class="departures-content">
        <p class="empty-msg">Selecteer een halte om vertrektijden te bekijken.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Data: <a href="https://gtfs.ovapi.nl" target="_blank">OVapi GTFS</a> · <a href="https://data.gtfs.be" target="_blank">GTFS.be</a></p>
    <p id="feedsInfo" class="feeds-info"></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=6" type="module"></script>
</body>
</html>
