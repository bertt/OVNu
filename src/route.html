<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVNu – Route</title>
  <link rel="stylesheet" href="style.css?v=7" />
  <style>
    .route-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .route-badge {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-light);
      padding: .2rem .7rem;
      border-radius: var(--radius);
      white-space: nowrap;
    }
    .route-meta { line-height: 1.6; }
    .route-meta strong { font-size: 1rem; }
    .route-meta small { color: var(--gray-700); font-size: .85rem; display: block; }

    .date-display {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--blue-dark);
      background: var(--blue-light);
      border: 1px solid #c5d6f8;
      border-radius: var(--radius);
      padding: .55rem 1rem;
      margin-bottom: 1rem;
    }

    .trips-count { font-size: .85rem; color: var(--gray-700); margin-bottom: .5rem; }

    .back-link {
      display: inline-flex; align-items: center; gap: .3rem;
      color: var(--blue); text-decoration: none; font-size: .9rem; margin-bottom: 1rem;
    }
    .back-link:hover { text-decoration: underline; }
    .error-msg { color: #e53e3e; padding: 1rem 0; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div>
        <h1>🚏 OVNu</h1>
        <p class="subtitle">Vertrektijden bus, trein & tram</p>
      </div>
      <a href="routes" style="color:#fff;opacity:.9;font-size:.85rem;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.5);padding:.3rem .75rem;border-radius:20px">📋 Alle routes</a>
    </div>
  </header>

  <main style="max-width:800px;margin:0 auto;padding:1.2rem 1rem 2rem">
    <a href="./" class="back-link">← Terug</a>

    <div id="routeHeader" class="route-header"></div>

    <div id="dateDisplay" class="date-display"></div>

    <p id="tripsCount" class="trips-count"></p>
    <div id="tripsContent"></div>
    <div id="errorMsg" class="error-msg" hidden></div>
  </main>

  <footer>
    <p>Data: <a href="https://gtfs.ovapi.nl" target="_blank">OVapi GTFS</a> •
       Alle NL OV-operators: bus, trein, tram, metro & meer</p>
  </footer>

  <script type="module">
    const ROUTE_TYPE_ICON = { 0:'🚋',1:'🚇',2:'🚆',3:'🚌',4:'⛴️',7:'🚡',11:'🚎',12:'🚝' };

    const params  = new URLSearchParams(location.search);
    const routeId = params.get('route_id');
    const dateParam = params.get('date'); // YYYYMMDD

    let tripsData = null;

    const DAYS   = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
    const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function toDateStr(d) {
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    }

    function parseDate(s) {
      // YYYYMMDD → Date
      return new Date(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`);
    }

    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    function formatTime(t) {
      const [h, m] = t.split(':').map(Number);
      const overnight = h >= 24;
      const display = `${String(h % 24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      return overnight ? `${display}<span class="overnight" title="Volgende dag">+1</span>` : display;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTrips(selectedDate) {
      if (!tripsData) return;
      const dateStr  = toDateStr(selectedDate);
      const todayStr = toDateStr(new Date());
      const isToday  = dateStr === todayStr;
      const nowMin   = isToday ? new Date().getHours() * 60 + new Date().getMinutes() : -1;

      const activeSids = new Set();
      for (const [sid, dates] of Object.entries(tripsData.services || {})) {
        if (dates.includes(dateStr)) activeSids.add(sid);
      }

      const trips = (tripsData.trips || []).filter(t => activeSids.has(t.sid));

      document.getElementById('tripsCount').textContent =
        `${trips.length} rit${trips.length !== 1 ? 'ten' : ''}`;

      if (trips.length === 0) {
        document.getElementById('tripsContent').innerHTML =
          `<p class="empty-msg">Geen ritten gevonden voor deze datum.</p>`;
        return;
      }

      // For today: mark first upcoming trip; for other dates: mark first trip
      const nextIdx = isToday
        ? trips.findIndex(t => timeToMinutes(t.departure) >= nowMin)
        : 0;

      let html = `<table class="dep-table">
        <thead><tr><th>Vertrektijd</th><th>Richting</th></tr></thead>
        <tbody>`;
      trips.forEach((trip, i) => {
        const isPast = isToday && timeToMinutes(trip.departure) < nowMin;
        const cls = i === nextIdx && nextIdx >= 0 ? 'next-up' : (isPast ? 'past' : '');
        html += `<tr class="${cls}">
          <td class="dep-time">${formatTime(trip.departure)}</td>
          <td>${escHtml(trip.headsign)}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('tripsContent').innerHTML = html;
    }

    try {
      if (!routeId) throw new Error('Geen route_id opgegeven in URL.');

      const selectedDate = dateParam ? parseDate(dateParam) : new Date();
      const dag   = DAYS[selectedDate.getDay()];
      const datum = `${selectedDate.getDate()} ${MONTHS[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
      document.getElementById('dateDisplay').innerHTML =
        `📅 Ritten op <strong>${dag} ${datum}</strong>`;

      const [infoRes, tripsRes] = await Promise.all([
        fetch(`../data/route-stops/${routeId}.json`),
        fetch(`../data/route-trips/${routeId}.json`)
      ]);
      if (!infoRes.ok) throw new Error(`Route ${routeId} niet gevonden (${infoRes.status}).`);

      const info = await infoRes.json();
      tripsData = tripsRes.ok ? await tripsRes.json() : { trips: [], services: {} };

      const icon = ROUTE_TYPE_ICON[info.route_type ?? 3] ?? '🚌';
      document.title = `OVNu – Route ${info.short_name || routeId}`;

      document.getElementById('routeHeader').innerHTML = `
        <div class="route-badge">${icon} ${escHtml(info.short_name || routeId)}</div>
        <div class="route-meta">
          ${info.long_name ? `<strong>${escHtml(info.long_name)}</strong>` : ''}
          <small>${escHtml(info.agency_name || '')}</small>
        </div>`;

      renderTrips(selectedDate);

    } catch (err) {
      const el = document.getElementById('errorMsg');
      el.textContent = `Fout: ${err.message}`;
      el.hidden = false;
    }
  </script>
</body>
</html>
