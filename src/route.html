<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVNu – Lijn</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    .route-header {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .route-badge {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--blue);
      background: var(--blue-light);
      padding: .2rem .7rem;
      border-radius: var(--radius);
      white-space: nowrap;
    }
    .route-meta { line-height: 1.4; }
    .route-meta strong { font-size: 1rem; }
    .route-meta small { color: var(--gray-700); font-size: .82rem; display: block; }

    .dir-tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
    .dir-tab {
      padding: .35rem .8rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 20px;
      background: #fff;
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .dir-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 1rem; align-items: start; }
    @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } }

    #routeMap { height: 420px; border-radius: var(--radius); box-shadow: var(--shadow); background: var(--gray-200); }

    .stops-panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: .8rem;
      max-height: 420px;
      overflow-y: auto;
    }
    .stops-panel h3 { font-size: .85rem; color: var(--gray-700); margin-bottom: .5rem; }

    .stop-line-list { list-style: none; display: flex; flex-direction: column; }
    .stop-line-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .3rem .4rem;
      border-left: 3px solid var(--gray-200);
      position: relative;
      cursor: pointer;
    }
    .stop-line-item:first-child { border-radius: 3px 0 0 0; }
    .stop-line-item:hover { background: var(--blue-light); border-left-color: var(--blue); }
    .stop-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
      margin-left: -6px;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px var(--blue);
    }
    .stop-line-item:first-child .stop-dot,
    .stop-line-item:last-child  .stop-dot { background: var(--blue-dark); }
    .stop-link {
      font-size: .85rem;
      color: var(--gray-900);
      text-decoration: none;
      flex: 1;
    }
    .stop-link:hover { color: var(--blue); text-decoration: underline; }

    .back-link {
      display: inline-flex; align-items: center; gap: .3rem;
      color: var(--blue); text-decoration: none; font-size: .9rem; margin-bottom: 1rem;
    }
    .back-link:hover { text-decoration: underline; }
    .error-msg { color: #e53e3e; padding: 1rem 0; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
      <div>
        <h1>🚏 OVNu</h1>
        <p class="subtitle">Vertrektijden bus, trein & tram</p>
      </div>
      <a href="lines" style="color:#fff;opacity:.9;font-size:.85rem;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.5);padding:.3rem .75rem;border-radius:20px">📋 Alle lijnen</a>
    </div>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2rem">
    <a href="lines" class="back-link">← Terug naar alle lijnen</a>

    <div id="routeHeader" class="route-header"></div>
    <div id="dirTabs" class="dir-tabs" hidden></div>

    <div class="layout">
      <div class="stops-panel">
        <h3 id="stopCount"></h3>
        <ul id="stopList" class="stop-line-list"></ul>
      </div>
      <div id="routeMap"></div>
    </div>

    <div id="errorMsg" class="error-msg" hidden></div>
  </main>

  <footer>
    <p>Data: <a href="https://gtfs.ovapi.nl" target="_blank">OVapi GTFS</a> •
       Alle NL OV-operators: bus, trein, tram, metro & meer</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    const ROUTE_TYPE_ICON = { 0:'🚋',1:'🚇',2:'🚆',3:'🚌',4:'⛴️',7:'🚡',11:'🚎',12:'🚝' };
    const DIR_LABEL = { '0': 'Heen ➜', '1': '← Terug' };

    const params  = new URLSearchParams(location.search);
    const routeId = params.get('id');
    const line    = params.get('line') || '';
    const agency  = params.get('agency') || '';

    document.title = `OVNu – Lijn ${line}`;

    let map = null;
    let markersLayer = null;
    let routeData = null;
    let currentDir = null;

    function initMap(lat, lon) {
      map = L.map('routeMap').setView([lat, lon], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);
    }

    function renderStops(dirId) {
      currentDir = dirId;
      const stops = routeData[dirId] || [];

      // Update active tab
      document.querySelectorAll('.dir-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.dir === dirId));

      // Stop list
      const ul = document.getElementById('stopList');
      ul.innerHTML = '';
      document.getElementById('stopCount').textContent =
        `${stops.length} haltes`;

      stops.forEach(stop => {
        const li = document.createElement('li');
        li.className = 'stop-line-item';
        li.innerHTML = `<span class="stop-dot"></span>
          <a class="stop-link" href="./?stop=${encodeURIComponent(stop.name)}"
             title="Bekijk vertrektijden">${escHtml(stop.name)}</a>`;
        li.addEventListener('click', e => {
          if (e.target.tagName !== 'A') {
            // centre map on stop
            map?.setView([stop.lat, stop.lon], 15);
          }
        });
        ul.appendChild(li);
      });

      // Map
      if (!map) {
        const mid = stops[Math.floor(stops.length / 2)] || stops[0];
        if (mid) initMap(mid.lat, mid.lon);
      }
      if (!map || stops.length === 0) return;

      markersLayer.clearLayers();

      // Draw polyline
      const latlngs = stops.map(s => [s.lat, s.lon]);
      L.polyline(latlngs, { color: '#1a56db', weight: 4, opacity: .8 }).addTo(markersLayer);

      // Start / end markers
      const busIcon = (label) => L.divIcon({
        html: `<div style="background:var(--blue,#1a56db);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.3)">${label}</div>`,
        className: '', iconAnchor: [0, 10]
      });

      if (stops.length > 0) {
        L.marker([stops[0].lat, stops[0].lon], { icon: busIcon(stops[0].name) }).addTo(markersLayer);
        L.marker([stops[stops.length-1].lat, stops[stops.length-1].lon],
          { icon: busIcon(stops[stops.length-1].name) }).addTo(markersLayer);
      }

      // Intermediate stops as small circles
      stops.slice(1, -1).forEach(s => {
        L.circleMarker([s.lat, s.lon], {
          radius: 4, fillColor: '#1a56db', color: '#fff', weight: 1.5, fillOpacity: 1
        }).addTo(markersLayer).bindPopup(`<strong>${s.name}</strong>`);
      });

      map.fitBounds(L.latLngBounds(latlngs), { padding: [30, 30] });
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function load() {
      if (!routeId) throw new Error('Geen route_id opgegeven in URL.');
      // routeId is "feed:localId" (e.g. "nl:127769") → path "feed/localId"
      const res = await fetch(`../data/route-stops/${routeId.replace(':', '/')}.json`);
      if (!res.ok) throw new Error(`Route ${routeId} niet gevonden (${res.status}).`);
      return res.json();
    }

    try {
      routeData = await load();
      const dirs = Object.keys(routeData).sort();

      // Header
      const icon = ROUTE_TYPE_ICON[3]; // default bus; could be passed via URL
      document.getElementById('routeHeader').innerHTML = `
        <div class="route-badge">${escHtml(line)}</div>
        <div class="route-meta">
          <strong>${escHtml(routeData[dirs[0]]?.[0]?.name ?? '')} ↔ ${escHtml(routeData[dirs[0]]?.[routeData[dirs[0]]?.length-1]?.name ?? '')}</strong>
          <small>${escHtml(agency)}</small>
        </div>`;

      // Direction tabs
      if (dirs.length > 1) {
        const tabBar = document.getElementById('dirTabs');
        tabBar.hidden = false;
        dirs.forEach(d => {
          const btn = document.createElement('button');
          btn.className = 'dir-tab';
          btn.dataset.dir = d;
          const endStop = routeData[d]?.[routeData[d].length - 1]?.name || `Richting ${d}`;
          btn.textContent = `${d === '0' ? '➜' : '←'} ${endStop}`;
          btn.addEventListener('click', () => renderStops(d));
          tabBar.appendChild(btn);
        });
      }

      renderStops(dirs[0]);

    } catch (err) {
      const el = document.getElementById('errorMsg');
      el.textContent = `Fout: ${err.message}`;
      el.hidden = false;
    }
  </script>
</body>
</html>
