<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OVNu – Alle lijnen</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <style>
    .lines-search {
      max-width: 420px;
      margin: 0 auto 1.2rem;
    }
    .lines-search input {
      width: 100%;
      padding: .65rem .9rem;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .lines-search input:focus { border-color: var(--blue); }

    .agency-section { margin-bottom: 1.8rem; }
    .agency-section[hidden] { display: none; }

    .agency-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-700);
      margin-bottom: .6rem;
      padding-bottom: .35rem;
      border-bottom: 2px solid var(--gray-200);
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .agency-count {
      font-size: .75rem;
      font-weight: 400;
      background: var(--gray-200);
      border-radius: 10px;
      padding: .1rem .45rem;
      color: var(--gray-700);
    }

    .route-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }

    .route-chip {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      padding: .35rem .65rem;
      min-width: 60px;
      max-width: 220px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      text-decoration: none;
      color: inherit;
    }
    .route-chip:hover { border-color: var(--blue); background: var(--blue-light); }
    .route-chip[hidden] { display: none; }

    .chip-number {
      font-weight: 700;
      font-size: .95rem;
      color: var(--blue);
      white-space: nowrap;
    }
    .chip-name {
      font-size: .75rem;
      color: var(--gray-700);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-icon { font-size: .8rem; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      color: var(--blue);
      text-decoration: none;
      font-size: .9rem;
      margin-bottom: 1rem;
    }
    .back-link:hover { text-decoration: underline; }

    .no-results {
      color: var(--gray-700);
      font-size: .9rem;
      padding: 1rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚏 OVNu – Alle lijnen</h1>
    <p class="subtitle">Overzicht van alle OV-lijnen in Nederland, geordend per maatschappij</p>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:1.2rem 1rem 2rem">
    <a href="./" class="back-link">← Terug naar vertrekinfo</a>

    <div class="lines-search">
      <input type="text" id="filterInput" placeholder="Filter op lijn, naam of maatschappij…" autocomplete="off" />
    </div>

    <div id="noResults" class="no-results" hidden>Geen lijnen gevonden.</div>
    <div id="agencyList"></div>
  </main>

  <footer>
    <p>Data: <a href="https://gtfs.ovapi.nl" target="_blank">OVapi GTFS</a> •
       Alle NL OV-operators: bus, trein, tram, metro & meer</p>
  </footer>

  <script type="module">
    const ROUTE_TYPE_ICON = {
      0: '🚋', // Tram
      1: '🚇', // Metro
      2: '🚆', // Trein
      3: '🚌', // Bus
      4: '⛴️', // Ferry
      7: '🚡', // Funicular
      11:'🚎', // Trolleybus
      12:'🚝', // Monorail
    };

    async function load() {
      const res = await fetch('../data/lines.json');
      if (!res.ok) throw new Error('Kon lines.json niet laden');
      return res.json();
    }

    function render(agencies) {
      const container = document.getElementById('agencyList');
      container.innerHTML = '';

      for (const agency of agencies) {
        const section = document.createElement('div');
        section.className = 'agency-section';
        section.dataset.agency = agency.agency_name.toLowerCase();

        const heading = document.createElement('div');
        heading.className = 'agency-name';
        heading.innerHTML = `${agency.agency_name}
          <span class="agency-count">${agency.routes.length} lijnen</span>`;
        section.appendChild(heading);

        const grid = document.createElement('div');
        grid.className = 'route-grid';

        for (const route of agency.routes) {
          const icon = ROUTE_TYPE_ICON[route.route_type] ?? '🚌';
          const chip = document.createElement('a');
          chip.className = 'route-chip';
          chip.href = `route?id=${encodeURIComponent(route.id)}&line=${encodeURIComponent(route.short_name)}&agency=${encodeURIComponent(agency.agency_name)}&type=${route.route_type ?? 3}`;
          chip.title = route.long_name || route.short_name;
          chip.dataset.line = (route.short_name + ' ' + route.long_name).toLowerCase();
          chip.innerHTML = `
            <span class="chip-number"><span class="type-icon">${icon}</span> ${escHtml(route.short_name)}</span>
            ${route.long_name ? `<span class="chip-name">${escHtml(route.long_name)}</span>` : ''}
          `;
          grid.appendChild(chip);
        }

        section.appendChild(grid);
        container.appendChild(section);
      }
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function applyAgency(name) {
      const q = name.toLowerCase();
      document.querySelectorAll('.agency-section').forEach(section => {
        section.hidden = section.dataset.agency !== q;
        section.querySelectorAll('.route-chip').forEach(c => c.hidden = false);
      });
      document.getElementById('noResults').hidden =
        document.querySelectorAll('.agency-section:not([hidden])').length > 0;
    }

    function applyFilter(q) {
      const sections = document.querySelectorAll('.agency-section');
      let anyVisible = false;

      sections.forEach(section => {
        const agencyMatch = section.dataset.agency.includes(q);
        let chipVisible = 0;

        section.querySelectorAll('.route-chip').forEach(chip => {
          const match = agencyMatch || chip.dataset.line.includes(q);
          chip.hidden = !match;
          if (match) chipVisible++;
        });

        section.hidden = chipVisible === 0 && !agencyMatch;
        if (!section.hidden) anyVisible = true;

        // If agency name matches, show all chips
        if (agencyMatch) section.querySelectorAll('.route-chip').forEach(c => c.hidden = false);
      });

      document.getElementById('noResults').hidden = anyVisible;
    }

    try {
      const agencies = await load();
      render(agencies);

      const params = new URLSearchParams(location.search);
      const filterInput = document.getElementById('filterInput');

      // ?agency=NS: show only that agency, update heading
      const agencyParam = params.get('agency');
      if (agencyParam) {
        document.querySelector('.subtitle').textContent =
          `Lijnen van ${agencyParam}`;
        applyAgency(agencyParam);
      }

      // ?filter=...: pre-fill text filter
      const filterParam = params.get('filter');
      if (filterParam && !agencyParam) {
        filterInput.value = filterParam;
        applyFilter(filterParam.toLowerCase());
      }

      filterInput.addEventListener('input', e => {
        const q = e.target.value.trim().toLowerCase();
        applyFilter(q);
        const url = new URL(location.href);
        if (q) url.searchParams.set('filter', e.target.value.trim());
        else url.searchParams.delete('filter');
        history.replaceState(null, '', url.toString());
      });
    } catch (err) {
      document.getElementById('agencyList').innerHTML =
        `<p style="color:red">Fout bij laden: ${err.message}. Zorg dat npm run build is uitgevoerd.</p>`;
    }
  </script>
</body>
</html>
